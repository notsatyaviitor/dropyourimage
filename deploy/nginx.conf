# DropYourImage — nginx site. Install to /etc/nginx/sites-available/dyi, symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# This file is the security perimeter. The application has NO authentication and NO rate limiting
# of its own, and `POST /jobs` spends about $0.02 per image on a segmentation vendor. Everything
# that stops an unknown caller running up a bill is here.

# Rate limit zone: 10 requests/second per IP with a burst, which is generous for a human driving
# the wizard and hostile to a script. `POST /jobs` gets a much tighter zone below — one request
# there can cost dollars, unlike a status poll.
limit_req_zone $binary_remote_addr zone=dyi_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=dyi_jobs:10m rate=10r/m;

server {
    listen 80;
    server_name dyi.example.com;          # <-- change
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dyi.example.com;          # <-- change

    ssl_certificate     /etc/letsencrypt/live/dyi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dyi.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- authentication -----------------------------------------------------
    # The whole site, including the frontend. Create the file with:
    #   sudo htpasswd -c /etc/nginx/.htpasswd-dyi <username>
    #
    # Basic auth over TLS is deliberately chosen over an app-level token: the browser handles it
    # natively, so the React app needs no changes and every request — page, API and asset — is
    # covered by one gate. Move to real accounts when you need per-user access or an audit trail.
    auth_basic           "DropYourImage";
    auth_basic_user_file /etc/nginx/.htpasswd-dyi;

    # --- upload size --------------------------------------------------------
    # MUST exceed MAX_ZIP_BYTES (1 GB by default) or a large batch dies mid-upload with a 413 that
    # the client reports as a network error. The browser already splits an order into ~50-file
    # archives, so this bounds one batch, not the whole job.
    client_max_body_size 1200m;
    client_body_timeout  600s;

    # --- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=dyi_general burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads are large and slow; the API answers POST /jobs with 202 as soon as the archive
        # has landed, so these cover the transfer rather than the processing.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_request_buffering off;      # stream to the app instead of spooling 1 GB to disk first
    }

    # Tighter limit on job creation specifically: this is the endpoint that costs money.
    # burst=5 lets the batched upload of one order through; a script gets throttled.
    location = /api/jobs {
        limit_req zone=dyi_jobs burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000/jobs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_request_buffering off;
    }

    # --- frontend -----------------------------------------------------------
    root /srv/dyi/frontend/dist;
    index index.html;

    # Hashed asset filenames, so they can be cached hard. index.html must not be, or a deploy
    # leaves browsers on the old bundle talking to the new API.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # --- headers ------------------------------------------------------------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    access_log /var/log/nginx/dyi.access.log;
    error_log  /var/log/nginx/dyi.error.log;
}
