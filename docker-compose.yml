# Local dev services only. Not a production topology — no auth, no TLS, no persistence
# guarantees. See docs/SETUP.md.
#
#   docker compose up -d
#
# The backend and frontend are run directly (uvicorn / vite) during the sprint so reloads are
# instant. Their Dockerfiles exist for parity, under the `apps` profile:
#   docker compose --profile apps up -d

services:
  redis:
    image: redis:7-alpine
    container_name: dyi-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no   # ephemeral: it is a job queue, not a store
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible storage, so the storage layer is written against the real API from Day 1
  # rather than against the local filesystem and ported later.
  minio:
    image: minio/minio:latest
    container_name: dyi-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console: http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin   # local dev only; mirrors backend/.env.example
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Creates the bucket once, then exits. Saves a manual console step on a fresh machine.
  minio-init:
    image: minio/mc:latest
    container_name: dyi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/dyi-poc &&
      echo 'bucket dyi-poc ready'
      "

volumes:
  minio-data:
